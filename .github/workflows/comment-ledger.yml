name: Comment ledger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ledger:
    name: Comment ledger gate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/comment-policy/ledger_gate.py
